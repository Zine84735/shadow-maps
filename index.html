  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1e1e1e;
    }
    #map {
      height: 100%;
      width: 100%;
      background: #2d2d2d;
    }

    .leaflet-control-zoom {
      display: none !important;
    }

    .custom-zoom {
      position: absolute;
      bottom: 30px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .custom-zoom button {
      width: 48px;
      height: 48px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      color: #e0e0e0;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      transition: all 0.2s;

    }
    .custom-zoom button:hover {
      background: #2a2a2a;
      border-color: rgba(255,255,255,0.4);
      transform: scale(1.05);
    }
    .custom-zoom button:active {
      transform: scale(0.95);
      background: #3a3a3a;
    }

    /* Кнопки слева внизу */
    .left-bottom-buttons {
      position: absolute;
      bottom: 30px;
      left: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .left-bottom-buttons button {
      width: 48px;
      height: 48px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      color: #e0e0e0;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      transition: all 0.2s;
      line-height: 1;
      user-select: none;
    }
    .left-bottom-buttons button:hover {
      background: #2a2a2a;
      border-color: rgba(255,255,255,0.4);
      transform: scale(1.05);
    }
    .left-bottom-buttons button:active {
      transform: scale(0.95);
      background: #3a3a3a;
    }

    .main-menu-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1100;
      width: 50px;
      height: 50px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      transition: all 0.25s;
      color: #ddd;
      font-size: 24px;
    }
    .main-menu-btn:hover {
      background: #2a2a2a;
      border-color: rgba(255,255,255,0.4);
    }

    .menu-panel {
      position: absolute;
      top: 75px;
      left: 15px;
      z-index: 1090;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: none;
      flex-direction: column;
      gap: 8px;
      min-width: 270px;
      max-width: 300px;
      color: #e0e0e0;
      max-height: 80vh;
      overflow-y: auto;
    }
    .menu-panel.visible {
      display: flex;
    }

    .menu-btn {
      background: rgba(50, 50, 50, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;

    }
    .menu-btn.active-mode {

      border-color: #d97706;

    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0a0a0;
      margin: 2px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-container {
      display: flex;
      gap: 6px;
    }
    .search-container input {
      flex: 1;
      background: rgba(40, 40, 40, 0.9);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;

    .search-container button {
      background: #2563eb;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      color: white;

      cursor: pointer;
      font-size: 14px;
    }
    .search-container button:hover {
      background: #1d4ed8;
    }

    .search-results {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .search-result-item {
      background: rgba(50,50,50,0.7);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid transparent;
      transition: 0.15s;
      display: flex;
      justify-content: space-between;

    .search-result-item:hover {

    .abandoned-popup {

    .abandoned-popup .action-buttons button {

    .abandoned-popup .delete-btn:hover {

    .leaflet-popup-content-wrapper {
      background: transparent;
      box-shadow: none;
      border-radius: 0;
    }
    .leaflet-popup-tip {
      background: #1f1f1f;
    }

    .mode-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      border-radius: 25px;

    .layer-btn.active-layer {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 0 12px rgba(59,130,246,0.5);

    .panorama-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;

    }
    .panorama-modal.active {

    .panorama-header {
      display: flex;
      justify-content: space-between;

    @keyframes fadeIn {

<body>
  <div id="map"></div>

  <!-- Кнопки слева внизу: геолокация и север -->
  <div class="left-bottom-buttons">
    <button id="geolocationBtn" title="Моё местоположение">📍</button>
    <button id="northBtn" title="Повернуть карту на север">🧭</button>
  </div>

  <div class="custom-zoom">
    <button id="zoomInBtn" title="Приблизить">+</button>
    <button id="zoomOutBtn" title="Отдалить">−</button>
  </div>

  <div class="main-menu-btn" id="menuToggleBtn" title="Меню">☰</div>

  <div class="menu-panel" id="menuPanel">
    <div class="section-title">
      <span>🔍 Поиск объектов</span>
      <span class="counter-badge" id="totalCount">0</span>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Название или описание...">
      <button id="searchBtn">🔍</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    
    <div class="separator"></div>
    
    <button id="addMarkerMenuBtn" class="menu-btn">🏚️ Добавить объект</button>
    <button id="panoramaMenuBtn" class="menu-btn">🌐 Открыть панораму</button>
    
    <div class="separator"></div>
    <div class="section-title">🗺️ Слои карты</div>
    <button id="layerSchemeBtn" class="menu-btn layer-btn active-layer">🗺️ Схема</button>
    <button id="layerSatelliteBtn" class="menu-btn layer-btn">🛰️ Спутник</button>
    <button id="layerHybridBtn" class="menu-btn layer-btn">🌐 Гибрид</button>

    <div class="separator"></div>
    <button id="saveJsonBtn" class="menu-btn">💾 Сохранить JSON</button>
    <button id="loadJsonBtn" class="menu-btn">📂 Загрузить JSON</button>
    <button id="exportKmlBtn" class="menu-btn">📄 Экспорт KML</button>
    <button id="importKmlBtn" class="menu-btn">📥 Импорт KML</button>
    <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
    <input type="file" id="kmlFileInput" accept=".kml" style="display: none;">
  </div>

  <div class="panorama-modal" id="panoramaModal">
    <div class="panorama-header">
      <span style="font-weight:bold; font-size:18px;">🌐 Google Street View</span>
      <button id="closePanoramaBtn">✕ Закрыть</button>
    </div>
    <iframe id="panoramaFrame" allowfullscreen></iframe>
  </div>

  <div class="mode-indicator" id="modeIndicator">📍 Кликните по карте для добавления объекта</div>

  <script>
    // Регистрация Service Worker для кеширования
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'abandoned-map-v1';
        const urlsToCache = [
          'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
          'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
        ];
        self.addEventListener('install', event => {
          event.waitUntil(
            caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
          );
        });
        self.addEventListener('fetch', event => {
          event.respondWith(
            caches.match(event.request).then(response => response || fetch(event.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl);
    }

    (function() {
      const map = L.map('map', {
        center: [55.7558, 37.6173],
        zoom: 5,
        minZoom: 2,
        maxZoom: 19,
        zoomControl: false,
        worldCopyJump: false
      });

      const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OSM',
        maxZoom: 19
      });
      const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '© Esri',
        maxZoom: 19
      });
      const labelsLayer = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        attribution: '© OSM',
        maxZoom: 19,
        opacity: 0.7
      });
      const hybridGroup = L.layerGroup([satelliteLayer, labelsLayer]);
      
      let currentBaseLayer = osmLayer;
      currentBaseLayer.addTo(map);

      const markersLayer = L.layerGroup().addTo(map);
      let markersData = [];
      let addMarkerMode = false;
      
      const menuToggleBtn = document.getElementById('menuToggleBtn');
      const menuPanel = document.getElementById('menuPanel');
      const addMarkerMenuBtn = document.getElementById('addMarkerMenuBtn');
      const geolocationBtn = document.getElementById('geolocationBtn');
      const northBtn = document.getElementById('northBtn');
      const panoramaMenuBtn = document.getElementById('panoramaMenuBtn');
      const saveJsonBtn = document.getElementById('saveJsonBtn');
      const loadJsonBtn = document.getElementById('loadJsonBtn');
      const exportKmlBtn = document.getElementById('exportKmlBtn');
      const importKmlBtn = document.getElementById('importKmlBtn');
      const jsonFileInput = document.getElementById('jsonFileInput');
      const kmlFileInput = document.getElementById('kmlFileInput');
      const modeIndicator = document.getElementById('modeIndicator');
      const layerSchemeBtn = document.getElementById('layerSchemeBtn');
      const layerSatelliteBtn = document.getElementById('layerSatelliteBtn');
      const layerHybridBtn = document.getElementById('layerHybridBtn');
      const layerBtns = [layerSchemeBtn, layerSatelliteBtn, layerHybridBtn];
      
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      
      const panoramaModal = document.getElementById('panoramaModal');
      const panoramaFrame = document.getElementById('panoramaFrame');
      const closePanoramaBtn = document.getElementById('closePanoramaBtn');

      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const searchResults = document.getElementById('searchResults');
      const totalCount = document.getElementById('totalCount');

      zoomInBtn.addEventListener('click', () => map.zoomIn());
      zoomOutBtn.addEventListener('click', () => map.zoomOut());

      // Кнопка "Север"
      northBtn.addEventListener('click', () => {
        map.getContainer().style.transform = '';
        // сбросим также возможный поворот через внутренний обработчик
        if (map._rotate) map._rotate = 0;
      });

      menuToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuPanel.classList.toggle('visible');
      });

      document.addEventListener('click', (e) => {
        if (!menuPanel.contains(e.target) && e.target !== menuToggleBtn) {
          menuPanel.classList.remove('visible');
        }
      });

      function updateTotalCount() {
        totalCount.textContent = markersData.length;
      }

      function setActiveLayerButton(btn) {
        layerBtns.forEach(b => b.classList.remove('active-layer'));
        btn.classList.add('active-layer');
      }

      function switchBaseLayer(newLayer, btn) {
        if (currentBaseLayer === hybridGroup) {
          map.removeLayer(hybridGroup);
        } else {
          map.removeLayer(currentBaseLayer);
        }
        if (newLayer === hybridGroup) {
          hybridGroup.addTo(map);
        } else {
          newLayer.addTo(map);
        }
        currentBaseLayer = newLayer;
        setActiveLayerButton(btn);
      }

      layerSchemeBtn.addEventListener('click', () => switchBaseLayer(osmLayer, layerSchemeBtn));
      layerSatelliteBtn.addEventListener('click', () => switchBaseLayer(satelliteLayer, layerSatelliteBtn));
      layerHybridBtn.addEventListener('click', () => switchBaseLayer(hybridGroup, layerHybridBtn));

      panoramaMenuBtn.addEventListener('click', () => {
        const center = map.getCenter();
        panoramaFrame.src = `https://www.google.com/maps/embed?pb=!4v1!6m8!1m3!1d0!2d${center.lng.toFixed(6)}!3d${center.lat.toFixed(6)}!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sru!2sru`;
        panoramaModal.classList.add('active');
        menuPanel.classList.remove('visible');
      });

      closePanoramaBtn.addEventListener('click', () => {
        panoramaModal.classList.remove('active');
        panoramaFrame.src = '';
      });

      geolocationBtn.addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert('Геолокация не поддерживается вашим браузером');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const userLatLng = L.latLng(lat, lng);
            
            const userMarker = L.marker(userLatLng, {
              icon: L.divIcon({
                className: 'custom-marker',
                html: '<div style="background:#3b82f6; width:20px; height:20px; border-radius:50%; border:3px solid white; box-shadow:0 0 15px #3b82f6;"></div>',
                iconSize: [20,20],
                iconAnchor: [10,10]
              })
            }).addTo(map).bindPopup('📍 Вы здесь').openPopup();
            
            if (markersData.length > 0) {
              let minDist = Infinity;
              let closestMarker = null;
              markersData.forEach(m => {
                const dist = map.distance(userLatLng, L.latLng(m.lat, m.lng));
                if (dist < minDist) {
                  minDist = dist;
                  closestMarker = m;
                }
              });
              if (closestMarker) {
                const distKm = (minDist / 1000).toFixed(2);
                alert(`Ближайший объект: ${closestMarker.name} (${distKm} км)`);
                const bounds = L.latLngBounds([userLatLng, L.latLng(closestMarker.lat, closestMarker.lng)]);
                map.fitBounds(bounds, { padding: [50, 50] });
                markersLayer.eachLayer(layer => {
                  if (layer._data && layer._data.id === closestMarker.id) {
                    layer.openPopup();
                  }
                });
              } else {
                map.setView(userLatLng, 15);
              }
            } else {
              map.setView(userLatLng, 15);
            }
            
            setTimeout(() => map.removeLayer(userMarker), 30000);
          },
          (err) => {
            alert('Ошибка геолокации: ' + err.message);
          }
        );
      });

      function performSearch() {
        const query = searchInput.value.trim().toLowerCase();
        searchResults.innerHTML = '';
        
        if (!query || markersData.length === 0) {
          if (markersData.length === 0 && query) {
            searchResults.innerHTML = '<div style="padding:8px;color:#888;">Ничего не найдено</div>';
          }
          return;
        }

        const filtered = markersData.filter(m => 
          m.name.toLowerCase().includes(query) || 
          m.description.toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
          searchResults.innerHTML = '<div style="padding:8px;color:#888;">Ничего не найдено</div>';
          return;
        }

        filtered.forEach(m => {
          const div = document.createElement('div');
          div.className = 'search-result-item';
          div.innerHTML = `
            <span>${m.iconEmoji || '🏚️'} ${esc(m.name)}</span>
            <span class="guard-badge">👮 ${m.guardLevel}/10</span>
          `;
          div.addEventListener('click', () => {
            map.setView([m.lat, m.lng], 16);
            markersLayer.eachLayer(layer => {
              if (layer._data && layer._data.id === m.id) {
                layer.openPopup();
              }
            });
            menuPanel.classList.remove('visible');
          });
          searchResults.appendChild(div);
        });
      }

      searchBtn.addEventListener('click', performSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') performSearch();
      });

      function enableAddMarkerMode() {
        addMarkerMode = true;
        addMarkerMenuBtn.classList.add('active-mode');
        modeIndicator.style.display = 'block';
        map.getContainer().style.cursor = 'crosshair';
        menuPanel.classList.remove('visible');
      }

      function disableAddMarkerMode() {
        addMarkerMode = false;
        addMarkerMenuBtn.classList.remove('active-mode');
        modeIndicator.style.display = 'none';
        map.getContainer().style.cursor = '';
      }

      addMarkerMenuBtn.addEventListener('click', () => {
        addMarkerMode ? disableAddMarkerMode() : enableAddMarkerMode();
      });

      map.on('click', (e) => {
        if (!addMarkerMode) return;
        
        const name = prompt('🏚️ Название объекта:', `Объект №${markersData.length + 1}`);
        if (name === null) return;
        
        const description = prompt('📝 Описание:', 'Заброшено');
        if (description === null) return;
        
        const guard = prompt('👮 Уровень охраны (0-10):', '3');
        if (guard === null) return;
        const guardLevel = Math.min(10, Math.max(0, parseInt(guard) || 0));
        
        const statusPrompt = prompt('📌 Статус:\n1 - не проверен\n2 - охраняется\n3 - свободен\n4 - снесён', '1');
        if (statusPrompt === null) return;
        const statusMap = { '1': 'unchecked', '2': 'guarded', '3': 'free', '4': 'demolished' };
        const status = statusMap[statusPrompt] || 'unchecked';
        
        const size = prompt('📏 Размер метки (20-60 пикселей):', '32');
        if (size === null) return;
        const markerSize = Math.min(60, Math.max(20, parseInt(size) || 32));
        
        const iconEmoji = prompt('🎨 Иконка (🏚️, 🏭, 🏥, 🏰, ⛪, 🚇 или свой эмодзи):', '🏚️');
        if (iconEmoji === null) return;

        // Дата последнего посещения
        const visitDate = prompt('📅 Дата последнего посещения (ГГГГ-ММ-ДД, можно пусто):', '');
        const lastVisitDate = visitDate ? visitDate.trim() : null;
        
        addMarker(e.latlng, name, description, guardLevel, status, markerSize, iconEmoji || '🏚️', lastVisitDate);
      });

      function getStatusColor(status) {
        switch(status) {
          case 'unchecked': return '#fbbf24';
          case 'guarded': return '#ef4444';
          case 'free': return '#22c55e';
          case 'demolished': return '#6b7280';
          default: return '#ffffff';
        }
      }

      function getStatusText(status) {
        switch(status) {
          case 'unchecked': return '❓ Не проверен';
          case 'guarded': return '🔒 Охраняется';
          case 'free': return '✅ Свободен';
          case 'demolished': return '💀 Снесён';
          default: return status;
        }
      }

      function createMarkerIcon(guard, size, status, iconEmoji) {
        const intensity = guard / 10;
        const red = Math.round(185 + (220 - 185) * intensity);
        const green = Math.round(28 + (38 - 28) * (1 - intensity));
        const blue = Math.round(28 + (38 - 28) * (1 - intensity));
        const bgColor = `rgb(${red},${green},${blue})`;
        const borderColor = getStatusColor(status);
        const halfSize = size / 2;
        const fontSize = size * 0.5;
        
        return L.divIcon({
          className: 'custom-marker marker-animate',
          html: `<div style="background:${bgColor}; width:${size}px; height:${size}px; border-radius:50%; border:3px solid ${borderColor}; box-shadow:0 0 12px black; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:${fontSize}px; animation: fadeIn 0.4s ease-out;">${iconEmoji}</div>`,
          iconSize: [size, size],
          iconAnchor: [halfSize, halfSize],
          popupAnchor: [0, -halfSize]
        });
      }

      function addMarker(latlng, name, desc, guard, status, size, iconEmoji, lastVisitDate = null) {
        const id = Date.now() + Math.random().toString(36);
        const icon = createMarkerIcon(guard, size, status, iconEmoji);

        const marker = L.marker(latlng, { icon, draggable: true, autoPan: true }).addTo(markersLayer);
        const data = { 
          id, lat: latlng.lat, lng: latlng.lng, 
          name, description: desc, guardLevel: guard, 
          status, markerSize: size, iconEmoji, lastVisitDate 
        };
        markersData.push(data);
        marker._data = data;
        updatePopup(marker);
        updateTotalCount();
        
        marker.on('dragend', () => {
          const pos = marker.getLatLng();
          marker._data.lat = pos.lat;
          marker._data.lng = pos.lng;
          updatePopup(marker);
        });
        
        marker.openPopup();
        return marker;
      }

      function findMarkerById(id) {
        let found = null;
        markersLayer.eachLayer(layer => {
          if (layer._data && layer._data.id === id) {
            found = layer;
          }
        });
        return found;
      }

      function editMarker(id) {
        const marker = findMarkerById(id);
        if (!marker) return;
        const data = marker._data;
        
        const newName = prompt('🏚️ Название объекта:', data.name);
        if (newName === null) return;
        
        const newDesc = prompt('📝 Описание:', data.description);
        if (newDesc === null) return;
        
        const newGuard = prompt('👮 Уровень охраны (0-10):', data.guardLevel);
        if (newGuard === null) return;
        const guardLevel = Math.min(10, Math.max(0, parseInt(newGuard) || 0));
        
        const statusMap = { '1': 'unchecked', '2': 'guarded', '3': 'free', '4': 'demolished' };
        const currentStatusKey = Object.keys(statusMap).find(k => statusMap[k] === data.status) || '1';
        const newStatusPrompt = prompt('📌 Статус:\n1 - не проверен\n2 - охраняется\n3 - свободен\n4 - снесён', currentStatusKey);
        if (newStatusPrompt === null) return;
        const newStatus = statusMap[newStatusPrompt] || data.status;
        
        const newSize = prompt('📏 Размер метки (20-60 пикселей):', data.markerSize);
        if (newSize === null) return;
        const markerSize = Math.min(60, Math.max(20, parseInt(newSize) || 32));
        
        const newIconEmoji = prompt('🎨 Иконка (эмодзи):', data.iconEmoji);
        if (newIconEmoji === null) return;

        const newVisitDate = prompt('📅 Дата последнего посещения (ГГГГ-ММ-ДД):', data.lastVisitDate || '');
        const lastVisitDate = newVisitDate ? newVisitDate.trim() : null;
        
        data.name = newName;
        data.description = newDesc;
        data.guardLevel = guardLevel;
        data.status = newStatus;
        data.markerSize = markerSize;
        data.iconEmoji = newIconEmoji || '🏚️';
        data.lastVisitDate = lastVisitDate;
        
        const newIcon = createMarkerIcon(guardLevel, markerSize, newStatus, data.iconEmoji);
        marker.setIcon(newIcon);
        
        updatePopup(marker);
        marker.openPopup();
      }

      function isOldVisit(dateStr) {
        if (!dateStr) return false;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return false;
        const visitDate = new Date(parts[0], parts[1] - 1, parts[2]);
        const now = new Date();
        const diffDays = (now - visitDate) / (1000 * 60 * 60 * 24);
        return diffDays > 30;
      }

      function updatePopup(marker) {
        const d = marker._data;
        const guardEmoji = d.guardLevel <= 2 ? '🟢' : (d.guardLevel <= 5 ? '🟡' : (d.guardLevel <= 7 ? '🟠' : '🔴'));
        const statusText = getStatusText(d.status);
        let visitHtml = '';
        if (d.lastVisitDate) {
          const old = isOldVisit(d.lastVisitDate);
          visitHtml = `<div class="visit-date">📅 Проверен: ${d.lastVisitDate} ${old ? '<span class="old-warning">⚠️ Давно не проверялся!</span>' : ''}</div>`;
        } else {
          visitHtml = '<div class="visit-date">📅 Нет данных о посещении</div>';
        }
        const html = `
          <div class="abandoned-popup">
            <h3>${d.iconEmoji || '🏚️'} ${esc(d.name)}</h3>
            <div class="coords">📍 ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}</div>
            <div class="desc">📋 ${esc(d.description)}</div>
            <div class="guard-level">${guardEmoji} Охрана: ${d.guardLevel}/10</div>
            <div class="status-line">📌 Статус: ${statusText}</div>
            ${visitHtml}
            <div class="action-buttons">
              <button class="edit-btn" data-id="${d.id}">✏️ Изменить</button>
              <button class="delete-btn" data-id="${d.id}">🗑️ Удалить</button>
            </div>
          </div>`;
        marker.unbindPopup();
        marker.bindPopup(html, { maxWidth: 280 });
        marker.on('popupopen', () => {
          setTimeout(() => {
            const editBtn = document.querySelector(`.edit-btn[data-id="${d.id}"]`);
            const deleteBtn = document.querySelector(`.delete-btn[data-id="${d.id}"]`);
            if (editBtn) editBtn.onclick = (e) => { e.stopPropagation(); editMarker(d.id); };
            if (deleteBtn) deleteBtn.onclick = (e) => { e.stopPropagation(); deleteMarker(d.id); };
          }, 50);
        });
      }

      function deleteMarker(id) {
        markersData = markersData.filter(m => m.id !== id);
        markersLayer.eachLayer(l => { if (l._data?.id === id) markersLayer.removeLayer(l); });
        updateTotalCount();
        performSearch();
      }

      function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      // Загрузка предустановленных объектов (только если карта пуста)
      function loadDefaultMarkers() {
        if (markersData.length > 0) return; // уже что-то загружено
        
        const defaults = [
          { lat: 51.711645, lng: 36.160852, name: 'Бомбоубежища (ККЗ)', desc: 'Состояния 0/10, хабар 0/10', guard: 0, status: 'unchecked', size: 32, icon: '🏚️', visit: '2026-01-15' },
          { lat: 51.700106, lng: 36.159246, name: 'Бомбоубежища (#505)', desc: 'Состояния 1/10, хабар 0/10', guard: 1, status: 'unchecked', size: 32, icon: '🏚️', visit: '2026-03-20' },
          { lat: 51.666421, lng: 36.128328, name: 'Бомбоубежища (#123)', desc: 'Состояние 2/10, хабар 1/10', guard: 1, status: 'unchecked', size: 32, icon: '🏚️', visit: '2025-12-01' },
          { lat: 51.722252, lng: 36.172905, name: 'Поддомник', desc: 'Нет описания', guard: 0, status: 'unchecked', size: 32, icon: '🏚️', visit: null },
          { lat: 51.747508, lng: 36.193444, name: 'Поддомник', desc: 'Нет описания', guard: 1, status: 'unchecked', size: 32, icon: '🏚️', visit: '2026-06-01' },
          { lat: 51.745316, lng: 36.224563, name: 'РЖД бомбоубежища #573', desc: 'Состояние 4/10, хабар 0/10', guard: 1, status: 'unchecked', size: 32, icon: '🚇', visit: '2026-05-10' },
          { lat: 51.730916, lng: 36.261954, name: 'АПЗ заброшенное 11-этажное здание', desc: 'Состояния 3/10, хабар 0/10', guard: 3, status: 'free', size: 32, icon: '🏭', visit: '2026-07-01' }
        ];
        
        defaults.forEach(obj => {
          addMarker(
            L.latLng(obj.lat, obj.lng),
            obj.name,
            obj.desc,
            obj.guard,
            obj.status,
            obj.size,
            obj.icon,
            obj.visit
          );
        });
      }

      // Сохранение/загрузка JSON
      saveJsonBtn.addEventListener('click', () => {
        const data = { markers: markersData, view: { center: map.getCenter(), zoom: map.getZoom() } };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `map_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        menuPanel.classList.remove('visible');
      });

      loadJsonBtn.addEventListener('click', () => { jsonFileInput.click(); menuPanel.classList.remove('visible'); });
      
      jsonFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            markersLayer.clearLayers();
            markersData = [];
            if (data.markers) {
              data.markers.forEach(m => {
                addMarker(
                  L.latLng(m.lat, m.lng), 
                  m.name, m.description, 
                  m.guardLevel || 0, 
                  m.status || 'unchecked', 
                  m.markerSize || 32, 
                  m.iconEmoji || '🏚️',
                  m.lastVisitDate
                );
              });
            }
            updateTotalCount();
            if (data.view) map.setView(data.view.center, data.view.zoom);
          } catch(err) { alert('Ошибка файла JSON'); }
        };
        reader.readAsText(file);
        jsonFileInput.value = '';
      });

      function generateKml() {
        let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Заброшенные объекты</name>`;
        markersData.forEach(m => {
          kml += `
    <Placemark>
      <name>${escXml(m.name)}</name>
      <description>${escXml(m.description)} Охрана: ${m.guardLevel}/10 Статус: ${getStatusText(m.status)}</description>
      <Point>
        <coordinates>${m.lng},${m.lat},0</coordinates>
      </Point>
    </Placemark>`;
        });
        kml += `
  </Document>
</kml>`;
        return kml;
      }

      function escXml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      exportKmlBtn.addEventListener('click', () => {
        const kml = generateKml();
        const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `objects_${new Date().toISOString().slice(0,10)}.kml`;
        a.click();
        menuPanel.classList.remove('visible');
      });

      importKmlBtn.addEventListener('click', () => { kmlFileInput.click(); menuPanel.classList.remove('visible'); });

      kmlFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const text = ev.target.result;
            const parser = new DOMParser();
            const xml = parser.parseFromString(text, 'text/xml');
            const placemarks = xml.querySelectorAll('Placemark');
            if (placemarks.length === 0) {
              alert('KML не содержит меток');
              return;
            }
            let added = 0;
            placemarks.forEach(pm => {
              const name = pm.querySelector('name')?.textContent || 'Импорт KML';
              const desc = pm.querySelector('description')?.textContent || '';
              const coords = pm.querySelector('coordinates')?.textContent?.trim();
              if (coords) {
                const parts = coords.split(',');
                const lng = parseFloat(parts[0]);
                const lat = parseFloat(parts[1]);
                if (!isNaN(lat) && !isNaN(lng)) {
                  addMarker(L.latLng(lat, lng), name, desc, 0, 'unchecked', 32, '🏚️', null);
                  added++;
                }
              }
            });
            updateTotalCount();
            alert(`Импортировано объектов: ${added}`);
          } catch(err) {
            alert('Ошибка обработки KML: ' + err.message);
          }
        };
        reader.readAsText(file);
        kmlFileInput.value = '';
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (addMarkerMode) disableAddMarkerMode();
          menuPanel.classList.remove('visible');
          panoramaModal.classList.remove('active');
          panoramaFrame.src = '';
        }
      });

      // Инициализация
      setActiveLayerButton(layerSchemeBtn);
      loadDefaultMarkers(); // добавит объекты только при пустой карте
      updateTotalCount();
    })();
  </script>
</body>
</html>
